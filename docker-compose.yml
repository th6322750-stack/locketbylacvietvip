version: '3.8'

services:
  locket-vip:
    build: .
    container_name: locket-vip-server
    restart: always
    ports:
      - "3000:3000"
    volumes:
      # Lưu trữ database khách hàng bên ngoài host để không bị mất khi restart container
      - ./vip_users.json:/app/vip_users.json
    environment:
      - NODE_ENV=production
      - PORT=3000
